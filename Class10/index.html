<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="container-fluid">
        <div class="container">
    <header class="navbar">
      <div class="logo-section">
        <div class="logo">
          <img class="custom" src="images/olx logo.png" alt="" />
        </div>
        <nav class="nav-link">
          <a href="#"
            ><img
              src="https://www.olx.com.pk/assets/iconMotors.6bf280165e43e55b173d0a53551e2bfb.png"
              alt=""
            />Motors</a
          >

          <a href="#"><img src="https://www.olx.com.pk/assets/iconProperty.d09c6d2e3621f900c17c9e8330a1a37b.png" alt="">Property</a>
        </nav>
      </div>


      <div class="auth-buttons">
        <span class="login">
            <a href="#">Login</a>
        </span>
        <a class="sell-btn" href="#">SELL <span>+</span></a>
      </div>
    </header>
    <section class="search-section">
        <div class="location-box">
            <div class="search">
                <span class="icon">
                    <img src="" alt="">
                </span>
                <input type="text" placeholder="Pakistan">
            </div>
            <div class="dropdown">
                <div class="use-location">
                    Use Current Location
                </div>
                <div class="divider"></div>
                <div class="section-title">popular</div>
                <ul>
                    <li>Lahore</li>
                    <li>Karachi</li>
                    <li>Multan</li>
                    <li>Islamabad</li>
                    <li>Quetta</li>
                </ul>
            </div>
        </div>
        <div class="search-box">
            <input type="text" placeholder="Find Cars Mobile phones and More ">
            <button class="search-btn">
               <i class="fa-solid fa-magnifying-glass" style="color: rgb(248, 244, 244);"></i>
           Search </button>
        </div>
    </section>
    </div>
    </div>
  </body>
</html>
